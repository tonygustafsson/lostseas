<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="160" height="160" viewBox="0 0 160 160">
  <!-- Colours match the gold-light, gold and gold-dark tokens in styles/globals.css -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(0.93 0.09 95)" />
      <stop offset="0.5" style="stop-color: oklch(0.78 0.13 85)" />
      <stop offset="1" style="stop-color: oklch(0.48 0.09 70)" />
    </linearGradient>

    <filter id="shade" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.6" dy="1" stdDeviation="0.9" flood-color="black" flood-opacity="0.85" />
    </filter>

    <!-- Half of the ornament, mirrored across the diagonal for the other edge -->
    <g id="half" fill="url(#gold)" stroke="url(#gold)" stroke-linecap="round">
      <path fill="none" stroke-width="3.2" d="M17 12 C28 2 50 0 58 8 C64 14 60 24 52 22 C46 20 47 13 53 14" />
      <path fill="none" stroke-width="2" d="M30 13 C36 7 45 9 45 16 C45 20 40 21 39 18" />
      <path fill="none" stroke-width="1.5" d="M36 5 C38 1 44 0 47 3" />
      <path stroke="none" d="M20 23 C26 14 38 13 46 21 C37 20 29 24 25 31 Z" />
      <circle stroke="none" cx="53" cy="14" r="2.2" />
      <circle stroke="none" cx="39" cy="18" r="1.4" />
    </g>

    <g id="corner" filter="url(#shade)">
      <use href="#half" xlink:href="#half" />
      <use href="#half" xlink:href="#half" transform="matrix(0 1 1 0 0 0)" />

      <path fill="url(#gold)" d="M17 17 C36 19 46 30 46 46 C30 46 19 36 17 17 Z" />
      <path fill="none" stroke="oklch(0.48 0.09 70)" stroke-width="1" stroke-linecap="round" d="M21 21 L41 41" />

      <circle fill="url(#gold)" cx="12" cy="12" r="7" />
      <circle fill="none" stroke="oklch(0.48 0.09 70)" stroke-width="1" cx="12" cy="12" r="4.5" />
      <circle fill="oklch(0.93 0.09 95)" cx="12" cy="12" r="2.5" />
    </g>
  </defs>

  <use href="#corner" xlink:href="#corner" />
  <use href="#corner" xlink:href="#corner" transform="matrix(-1 0 0 1 160 0)" />
  <use href="#corner" xlink:href="#corner" transform="matrix(1 0 0 -1 0 160)" />
  <use href="#corner" xlink:href="#corner" transform="matrix(-1 0 0 -1 160 160)" />
</svg>
